name: Release (main)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/release-main.yml'
      - '.github/workflows/release-dev.yml'
      - '.github/scripts/next-version.sh'

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: version
        run: |
          # dev -> main lands as a single squash-merged commit, so the individual feat:/fix:
          # subjects that decided dev's pre-release bump aren't visible here anymore. Promote the
          # latest dev pre-release's X.Y.Z as-is (dropping -dev.N) so main matches dev 1:1, rather
          # than re-deriving the bump from the squash commit's message (which is usually neither
          # feat: nor fix:, and would silently fall back to a patch bump). Only fall back to
          # next-version.sh's own scan when there's no dev pre-release ahead of the last release,
          # e.g. a hotfix committed straight to main.
          LAST_RELEASE_TAG=$( { git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -vE -- '-dev\.' | sort -V | tail -n1; } || true)
          LAST_RELEASE_TAG=${LAST_RELEASE_TAG:-v0.0.0}
          LAST_RELEASE_VERSION=${LAST_RELEASE_TAG#v}

          LATEST_DEV_TAG=$( { git tag -l 'v[0-9]*.[0-9]*.[0-9]*-dev.*' | sort -V | tail -n1; } || true)

          VERSION=""
          if [ -n "$LATEST_DEV_TAG" ]; then
              DEV_VERSION=${LATEST_DEV_TAG#v}
              DEV_RELEASE_VERSION=${DEV_VERSION%-dev.*}
              HIGHER=$(printf '%s\n%s\n' "$LAST_RELEASE_VERSION" "$DEV_RELEASE_VERSION" | sort -V | tail -n1)
              if [ "$HIGHER" = "$DEV_RELEASE_VERSION" ] && [ "$DEV_RELEASE_VERSION" != "$LAST_RELEASE_VERSION" ]; then
                  VERSION="$DEV_RELEASE_VERSION"
              fi
          fi

          if [ -z "$VERSION" ]; then
              VERSION=$(bash .github/scripts/next-version.sh)
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Build mod jar
        run: ./gradlew build -PoverrideVersion=${{ steps.version.outputs.version }}

      # Created as a draft first: this repo has immutable releases enabled, so GitHub only
      # accepts asset uploads before a release is published. Publishing (below) then fires
      # release.published with the jar already attached.
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: build/libs/*.jar

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --repo "${{ github.repository }}"
