name: Release (dev)

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/release-main.yml'
      - '.github/workflows/release-dev.yml'
      - '.github/scripts/next-version.sh'

permissions:
  contents: write

concurrency:
  group: release-dev
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute dev version
        id: version
        run: |
          NEXT_VERSION=$(bash .github/scripts/next-version.sh)
          # N starts at 1 and only continues an existing count when NEXT_VERSION
          # (the prospective release this would become) hasn't changed since the
          # last dev pre-release — i.e. no tags exist yet for this X.Y.Z.
          EXISTING=$(git tag -l "v${NEXT_VERSION}-dev.*" | wc -l | tr -d ' ')
          N=$((EXISTING + 1))
          echo "version=${NEXT_VERSION}-dev.${N}" >> "$GITHUB_OUTPUT"

      - name: Build mod jar
        run: ./gradlew build -PoverrideVersion=${{ steps.version.outputs.version }}

      # Created as a draft first: this repo has immutable releases enabled, so GitHub only
      # accepts asset uploads before a release is published. Publishing (below) then fires
      # release.published with the jar already attached.
      - name: Create draft GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: build/libs/*.jar

      - name: Publish pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --repo "${{ github.repository }}"
